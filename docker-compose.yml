services:

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: smartskale_candidate_db
      POSTGRES_USER: smartskale
      POSTGRES_PASSWORD: smartskale_dev

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U smartskale -d smartskale_candidate_db
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped


  keycloak-db-init:
    image: postgres:17-alpine

    environment:
      PGPASSWORD: root

    volumes:
      - ./infrastructure/postgres/create-keycloak-db.sql:/scripts/create-keycloak-db.sql:ro

    command:
      - sh
      - -c
      - psql -h postgres -U smartskale -d postgres -f /scripts/create-keycloak-db.sql

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2

    command:
      - start-dev
      - --import-realm

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: smartskale
      KC_DB_PASSWORD: smartskale_dev

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    ports:
      - "8180:8080"

    volumes:
      - ./infrastructure/keycloak/smartskale-realm.json:/opt/keycloak/data/import/smartskale-realm.json:ro

    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

    restart: unless-stopped


volumes:
  postgres_data: