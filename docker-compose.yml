name: talensora-candidate-sourcing-system

services:

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: talensora_candidate_db
      POSTGRES_USER: talensora
      POSTGRES_PASSWORD: ${TALENSORA_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U talensora -d talensora_candidate_db
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped


  keycloak-db-init:
    image: postgres:17-alpine

    environment:
      PGPASSWORD: ${TALENSORA_DB_PASSWORD}

    volumes:
      - ./infrastructure/postgres/create-keycloak-db.sql:/scripts/create-keycloak-db.sql:ro

    command:
      - sh
      - -c
      - psql -h postgres -U talensora -d postgres -f /scripts/create-keycloak-db.sql

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  mailpit:
    image: axllent/mailpit:v1.31.0

    ports:
      - "1025:1025"
      - "8025:8025"

    restart: unless-stopped


  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2

    command:
      - start-dev
      - --import-realm

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: talensora
      KC_DB_PASSWORD: ${TALENSORA_DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    ports:
      - "8180:8080"

    volumes:
      - ./infrastructure/keycloak/talensora-realm.json:/opt/keycloak/data/import/talensora-realm.json:ro

    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

    restart: unless-stopped


volumes:
  postgres_data:
    external: true
    name: talensora-candidate-sourcing-system_postgres_data
