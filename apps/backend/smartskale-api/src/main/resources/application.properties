package com.smartskale.sourcing.resume.validation;

import com.smartskale.sourcing.resume.domain.ResumeFileType;
import com.smartskale.sourcing.resume.exception.InvalidResumeException;

import org.springframework.beans.factory.annotation.Value;
import org.springframework.stereotype.Component;
import org.springframework.web.multipart.MultipartFile;

import java.io.ByteArrayInputStream;
import java.io.IOException;

import java.nio.charset.StandardCharsets;

import java.security.MessageDigest;
import java.security.NoSuchAlgorithmException;

import java.util.HexFormat;
import java.util.Locale;

import java.util.zip.ZipEntry;
import java.util.zip.ZipInputStream;

@Component
public class ResumeFileValidator {

    private static final byte[] DOC_SIGNATURE = {
            (byte) 0xD0,
            (byte) 0xCF,
            (byte) 0x11,
            (byte) 0xE0,
            (byte) 0xA1,
            (byte) 0xB1,
            (byte) 0x1A,
            (byte) 0xE1
    };

    private final long maximumSize;

    public ResumeFileValidator(
            @Value("${smartskale.resume.max-size-bytes:5242880}")
            long maximumSize
    ) {
        this.maximumSize = maximumSize;
    }

    public ValidatedResume validate(
            MultipartFile file
    ) {

        if (file == null || file.isEmpty()) {
            throw new InvalidResumeException(
                    "Resume file is required."
            );
        }

        if (file.getSize() > maximumSize) {
            throw new InvalidResumeException(
                    "Resume exceeds the maximum allowed size of 5 MB."
            );
        }

        String originalFilename =
                sanitizeFilename(
                        file.getOriginalFilename()
                );

        String extension =
                extractExtension(
                        originalFilename
                );

        byte[] bytes;

        try {

            bytes = file.getBytes();

        } catch (IOException exception) {

            throw new InvalidResumeException(
                    "Unable to read uploaded resume.",
                    exception
            );
        }

        ResumeFileType fileType =
                detectType(
                        extension,
                        bytes
                );

        return new ValidatedResume(
                originalFilename,
                fileType,
                fileType.getContentType(),
                bytes.length,
                calculateSha256(bytes),
                bytes
        );
    }

    private ResumeFileType detectType(
            String extension,
            byte[] bytes
    ) {

        return switch (extension) {

            case "pdf" -> {

                if (!isPdf(bytes)) {
                    throw invalidType();
                }

                yield ResumeFileType.PDF;
            }

            case "doc" -> {

                if (!isDoc(bytes)) {
                    throw invalidType();
                }

                yield ResumeFileType.DOC;
            }

            case "docx" -> {

                if (!isDocx(bytes)) {
                    throw invalidType();
                }

                yield ResumeFileType.DOCX;
            }

            default ->
                    throw new InvalidResumeException(
                            "Only PDF, DOC and DOCX resumes are allowed."
                    );
        };
    }

    private boolean isPdf(
            byte[] bytes
    ) {

        if (bytes.length < 5) {
            return false;
        }

        String header =
                new String(
                        bytes,
                        0,
                        5,
                        StandardCharsets.US_ASCII
                );

        return "%PDF-".equals(header);
    }

    private boolean isDoc(
            byte[] bytes
    ) {

        if (bytes.length < DOC_SIGNATURE.length) {
            return false;
        }

        for (int index = 0;
             index < DOC_SIGNATURE.length;
             index++) {

            if (bytes[index] != DOC_SIGNATURE[index]) {
                return false;
            }
        }

        return true;
    }

    private boolean isDocx(
            byte[] bytes
    ) {

        boolean contentTypesFound = false;
        boolean wordDocumentFound = false;

        try (
                ZipInputStream input =
                        new ZipInputStream(
                                new ByteArrayInputStream(bytes)
                        )
        ) {

            ZipEntry entry;

            while ((entry = input.getNextEntry()) != null) {

                String name = entry.getName();

                if ("[Content_Types].xml".equals(name)) {
                    contentTypesFound = true;
                }

                if ("word/document.xml".equals(name)) {
                    wordDocumentFound = true;
                }

                if (contentTypesFound && wordDocumentFound) {
                    return true;
                }
            }

        } catch (IOException exception) {

            return false;
        }

        return false;
    }

    private String sanitizeFilename(
            String filename
    ) {

        if (filename == null || filename.isBlank()) {
            throw new InvalidResumeException(
                    "Resume filename is required."
            );
        }

        String normalized =
                filename.replace(
                        '\\',
                        '/'
                );

        int separator =
                normalized.lastIndexOf('/');

        if (separator >= 0) {

            normalized =
                    normalized.substring(
                            separator + 1
                    );
        }

        normalized =
                normalized.replaceAll(
                        "[\\p{Cntrl}]",
                        ""
                );

        if (normalized.isBlank()) {
            throw new InvalidResumeException(
                    "Resume filename is invalid."
            );
        }

        if (normalized.length() > 255) {

            normalized =
                    normalized.substring(
                            normalized.length() - 255
                    );
        }

        return normalized;
    }

    private String extractExtension(
            String filename
    ) {

        int dot =
                filename.lastIndexOf('.');

        if (dot <= 0 ||
                dot == filename.length() - 1) {

            throw new InvalidResumeException(
                    "Resume must have a PDF, DOC or DOCX extension."
            );
        }

        return filename
                .substring(dot + 1)
                .toLowerCase(Locale.ROOT);
    }

    private String calculateSha256(
            byte[] content
    ) {

        try {

            MessageDigest digest =
                    MessageDigest.getInstance(
                            "SHA-256"
                    );

            return HexFormat
                    .of()
                    .formatHex(
                            digest.digest(content)
                    );

        } catch (NoSuchAlgorithmException exception) {

            throw new IllegalStateException(
                    "SHA-256 is unavailable.",
                    exception
            );
        }
    }

    private InvalidResumeException invalidType() {

        return new InvalidResumeException(
                "Resume file content does not match its extension."
        );
    }

    public record ValidatedResume(

            String originalFilename,

            ResumeFileType fileType,

            String contentType,

            long sizeBytes,

            String sha256,

            byte[] content

    ) {
    }
}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
