spring:

  application:
    name: talensora-candidate-sourcing-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/talensora_candidate_db}
    username: ${DB_USERNAME:talensora}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

    locations:
      - classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/talensora}


server:
  port: ${SERVER_PORT:9093}

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never


talensora:
  resume:
    storage:
      type: ${RESUME_STORAGE_TYPE:local}
      local-directory: ${RESUME_LOCAL_DIRECTORY:${user.home}/.talensora/resumes}
      s3:
        bucket: ${RESUME_S3_BUCKET:}
        prefix: ${RESUME_S3_PREFIX:talensora/resumes}
        region: ${AWS_REGION:}
        endpoint: ${RESUME_S3_ENDPOINT:}
