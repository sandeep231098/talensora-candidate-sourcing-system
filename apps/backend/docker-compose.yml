services:

  postgres:
    image: postgres:17-alpine
    container_name: talensora-postgres

    environment:
      POSTGRES_DB: talensora_candidate_db
      POSTGRES_USER: talensora
      POSTGRES_PASSWORD: ${TALENSORA_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U talensora -d talensora_candidate_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres_data:
