services:

  postgres:
    image: postgres:17-alpine
    container_name: smartskale-postgres

    environment:
      POSTGRES_DB: smartskale_candidate_db
      POSTGRES_USER: smartskale
      POSTGRES_PASSWORD: root

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U smartskale -d smartskale_candidate_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres_data:
