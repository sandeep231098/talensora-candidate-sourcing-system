name: End-to-End CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "infrastructure/keycloak/**"
      - "docker-compose.e2e.yml"
      - "scripts/e2e/**"
      - ".github/workflows/e2e-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "infrastructure/keycloak/**"
      - "docker-compose.e2e.yml"
      - "scripts/e2e/**"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

jobs:
  critical-journeys:
    name: Playwright critical journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_CANDIDATE_EMAIL: candidate-e2e@example.test
      E2E_RECRUITER_EMAIL: recruiter-e2e@example.test
      E2E_HR_EMAIL: hr-e2e@example.test
      E2E_ADMIN_EMAIL: admin-e2e@example.test
      E2E_HIRING_MANAGER_EMAIL: hiring-manager-e2e@example.test
      E2E_AUDITOR_EMAIL: auditor-e2e@example.test
      E2E_ACCOUNTS_EMAIL: accounts-e2e@example.test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Generate isolated runtime credentials
        shell: bash
        run: |
          for name in E2E_DB_PASSWORD E2E_KEYCLOAK_ADMIN_PASSWORD E2E_CANDIDATE_PASSWORD E2E_RECRUITER_PASSWORD E2E_HR_PASSWORD E2E_ADMIN_PASSWORD E2E_HIRING_MANAGER_PASSWORD E2E_AUDITOR_PASSWORD E2E_ACCOUNTS_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Install frontend dependencies and Chromium
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start isolated infrastructure
        run: |
          docker compose -p talensora-e2e -f docker-compose.e2e.yml up -d --wait
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:58180/realms/talensora/.well-known/openid-configuration && break
            sleep 2
          done
          curl --fail --silent http://localhost:58180/realms/talensora/.well-known/openid-configuration

      - name: Provision isolated Keycloak identities
        run: bash scripts/e2e/provision-users.sh

      - name: Start backend
        working-directory: apps/backend
        env:
          DB_URL: jdbc:postgresql://localhost:55433/talensora_candidate_db
          DB_USERNAME: talensora
          KEYCLOAK_ISSUER_URI: http://localhost:58180/realms/talensora
          SERVER_PORT: "59093"
          RESUME_LOCAL_DIRECTORY: ${{ github.workspace }}/.e2e/resumes
          SMTP_HOST: localhost
          SMTP_PORT: "51025"
        run: |
          chmod +x mvnw
          export DB_PASSWORD="$E2E_DB_PASSWORD"
          ./mvnw --batch-mode --no-transfer-progress -pl talensora-api -am package -DskipTests
          nohup java -jar talensora-api/target/talensora-api-0.0.1-SNAPSHOT.jar > ../../.e2e-backend.log 2>&1 &
          for attempt in {1..90}; do
            curl --fail --silent http://localhost:59093/actuator/health && break
            sleep 2
          done
          curl --fail --silent http://localhost:59093/actuator/health

      - name: Seed published requisition
        run: bash scripts/e2e/seed-requisition.sh

      - name: Start frontend
        working-directory: apps/frontend
        env:
          VITE_PORT: "55173"
          VITE_API_URL: http://localhost:59093
          VITE_KEYCLOAK_URL: http://localhost:58180
        run: |
          nohup npm run dev -- --host 0.0.0.0 > ../../.e2e-frontend.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:55173/ && break
            sleep 2
          done
          curl --fail --silent http://localhost:55173/

      - name: Run Chromium journeys
        working-directory: apps/frontend
        env:
          E2E_BASE_URL: http://localhost:55173
        run: npm run test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-failure-diagnostics
          path: |
            apps/frontend/test-results
            .e2e-backend.log
            .e2e-frontend.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Stop isolated environment
        if: always()
        run: docker compose -p talensora-e2e -f docker-compose.e2e.yml down --volumes --remove-orphans
