name: Configuration CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "docker-compose.yml"
      - "docker-compose.staging.yml"
      - "infrastructure/**"
      - "infra/aws/**"
      - ".env.staging.example"
      - ".github/workflows/config-ci.yml"

  pull_request:
    branches:
      - develop
      - main
    paths:
      - "docker-compose.yml"
      - "docker-compose.staging.yml"
      - "infrastructure/**"
      - "infra/aws/**"
      - ".env.staging.example"
      - ".github/workflows/config-ci.yml"

permissions:
  contents: read

jobs:
  configuration:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Docker Compose
        env:
          TALENSORA_DB_PASSWORD: ci-placeholder
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          KC_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        run: docker compose config --quiet

      - name: Validate Keycloak realm JSON
        run: python -m json.tool infrastructure/keycloak/talensora-realm.json > /dev/null

      - name: Validate staging Docker Compose
        env:
          FRONTEND_IMAGE: example.invalid/frontend:sha
          BACKEND_IMAGE: example.invalid/backend:sha
          STAGING_APP_HOST: staging.example.com
          STAGING_KEYCLOAK_HOST: id-staging.example.com
          TLS_CERT_DIRECTORY: /tmp/tls
          DB_URL: jdbc:postgresql://db.internal:5432/talensora_candidate_db
          DB_USERNAME: placeholder
          DB_PASSWORD: placeholder
          KEYCLOAK_ISSUER_URI: https://id-staging.example.com/realms/talensora
          RESUME_S3_BUCKET: placeholder-bucket
          AWS_REGION: ap-south-1
          SMTP_HOST: email-smtp.ap-south-1.amazonaws.com
          SMTP_USERNAME: placeholder
          SMTP_PASSWORD: placeholder
          SMTP_FROM: no-reply@example.com
          ADMIN_NOTIFICATION_EMAIL: recruiting@example.com
          KC_DB_URL: jdbc:postgresql://db.internal:5432/keycloak
          KC_DB_USERNAME: placeholder
          KC_DB_PASSWORD: placeholder
          KC_HOSTNAME: https://id-staging.example.com
          KC_BOOTSTRAP_ADMIN_USERNAME: placeholder
          KC_BOOTSTRAP_ADMIN_PASSWORD: placeholder
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
        run: docker compose -f docker-compose.staging.yml config --quiet

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Validate staging Terraform
        working-directory: infra/aws/staging
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Reject tracked environment files
        shell: bash
        run: |
          tracked_env_files="$({ git ls-files | grep -E '(^|/)\.env($|\.)' || true; } | grep -Ev '\.example$' || true)"

          if [[ -n "$tracked_env_files" ]]; then
            echo "Tracked environment files detected:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Check changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          fi
